name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  promotion:
    name: Main promotion policy
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Require development branch source
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$HEAD_REF" != "development" || "$HEAD_REPO" != "$REPOSITORY" ]]; then
            echo "Pull requests into main must promote the repository's development branch." >&2
            echo "head_ref=$HEAD_REF" >&2
            echo "head_repo=$HEAD_REPO" >&2
            echo "repository=$REPOSITORY" >&2
            exit 1
          fi

  main:
    name: Main full gates
    if: github.ref_name == 'main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Verify
        run: ./scripts/verify.sh

  development:
    name: Development quick gates
    if: github.ref_name == 'development' || github.base_ref == 'development'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Verify quick gate
        run: ./scripts/verify.sh --quick

  smoke:
    name: ${{ matrix.os }} smoke
    if: github.ref_name == 'main' || github.base_ref == 'main'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.1

      - name: Test
        run: cargo test --workspace --all-targets --locked
