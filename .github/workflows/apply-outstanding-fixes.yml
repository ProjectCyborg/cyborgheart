name: Apply outstanding contract fixes

on:
  push:
    branches:
      - agent/complete-pre-stage-1-contract
    paths:
      - .github/scripts/apply-outstanding-fixes.py
      - .github/workflows/apply-outstanding-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent